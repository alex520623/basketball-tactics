[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-tactics"
version = "0.0.0"
description = "MM course project: SportVU tracking data preparation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["ijson==3.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
